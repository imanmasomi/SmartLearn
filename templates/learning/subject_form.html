
{% extends "base.html" %}
{% block title %}Add Subject | SmartLearn{% endblock %}
{% block content %}
<section class="panel narrow">
  <p class="eyebrow">Your Personal Library</p>
  <h1>Add a New Subject</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Save Subject</button>
    <a class="text-link" href="{% url 'subjects' %}">Cancel</a>
  </form>
</section>
{% endblock %}

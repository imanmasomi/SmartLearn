
{% extends "base.html" %}

{% block title %}Edit Topic | SmartLearn{% endblock %}

{% block content %}

<section class="panel narrow">

    <p class="eyebrow">{{ subject.name }}</p>

    <h1>Edit Topic</h1>

    <p class="muted">
        Update the title of your learning topic.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="button" type="submit">
            Save Changes
        </button>

        <a
            class="text-link"
            href="{% url 'topic_list' subject.id %}"
        >
            Cancel
        </a>

    </form>

</section>

{% endblock %}

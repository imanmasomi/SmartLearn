
{% extends "base.html" %}

{% block title %}Delete Topic | SmartLearn{% endblock %}

{% block content %}

<section class="panel narrow">

    <p class="eyebrow">{{ subject.name }}</p>

    <h1>Delete Topic</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ topic.title }}</strong>?
    </p>

    <p class="muted">
        This action cannot be undone.
    </p>

    <form method="post">
        {% csrf_token %}

        <button class="button delete-button" type="submit">
            Yes, Delete
        </button>

        <a
            class="text-link"
            href="{% url 'topic_list' subject.id %}"
        >
            Cancel
        </a>

    </form>

</section>

{% endblock %}

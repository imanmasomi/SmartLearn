
{% extends "base.html" %}

{% block title %}Create Quiz | SmartLearn{% endblock %}

{% block content %}

<section class="panel narrow">
    <p class="eyebrow">Knowledge Check</p>
    <h1>Create a Quiz</h1>

    <p class="muted">
        Create a quiz for one of your subjects.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="button" type="submit">
            Create Quiz
        </button>

        <a class="text-link" href="{% url 'quizzes' %}">
            Cancel
        </a>
    </form>
</section>

{% endblock %}
